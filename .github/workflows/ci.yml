name: CI

on:
  pull_request:
  # Called by deploy.yml so the same checks gate production, without running twice
  # on a push to main.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check for unused code and dependencies
        run: bun run knip

      # The E2E suite asserts on real summit data, so it needs the real database.
      # Rebuilt at most weekly, matching the cadence of the upstream summit list,
      # so pull requests are not each paying for a 30 MB download and a rebuild.
      - name: Compute database cache key
        id: db-key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore SOTA database
        id: db-cache
        uses: actions/cache@v4
        with:
          path: public/data/sota.db
          key: sota-db-${{ steps.db-key.outputs.week }}-${{ hashFiles('scripts/build-sota-database.mjs') }}

      - name: Build SOTA database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/sota-summits-worldwide.csv https://storage.sota.org.uk/summitslist.csv
          bun run build:sota

      # Runs tsc, so this is the typecheck step as well as the bundle check.
      - name: Build
        run: bun run build

      # With coverage, so the thresholds in vitest.config.ts are enforced here
      # rather than being advisory.
      - name: Unit tests
        run: bun run test:coverage

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
