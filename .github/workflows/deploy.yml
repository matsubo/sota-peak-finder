name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run every Sunday at 00:00 UTC to update SOTA database
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Nothing reaches production without the full suite passing first.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download latest SOTA database
        run: |
          echo "📥 Downloading latest SOTA database..."
          curl -L -o /tmp/sota-summits-worldwide.csv https://storage.sota.org.uk/summitslist.csv
          echo "✅ Download complete ($(du -h /tmp/sota-summits-worldwide.csv | cut -f1))"

      - name: Build SOTA database
        run: |
          echo "🔨 Building SOTA database..."
          bun run build:sota
          echo "✅ Database built ($(du -h public/data/sota.db | cut -f1))"

      - name: Generate Sitemaps
        run: bun run build:sitemaps

      - name: Build
        run: bun run build
        env:
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PLFT9JFX' }}

      # The verify job tests the database it built itself. This run rebuilds from
      # a freshly downloaded CSV -- on the weekly cron, that is the only thing
      # that changes -- so the suite runs once more against the exact database
      # about to be published. An upstream format change fails here instead of
      # shipping an empty app.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests against the database being deployed
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deploy
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
