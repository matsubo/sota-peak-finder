  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // This script checks to see if a redirect is present in the query string,
    // converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which won't cause the browser to attempt to load the new url.
    // When the single page app is loaded further down in this file,
    // the correct url will be waiting in the browser's history for
    // the single page app to route accordingly.
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->

  <!--
    GitHub Pages cannot set response headers, so the policy is delivered by meta.
    Directives a meta-delivered policy ignores (frame-ancestors, report-uri,
    sandbox) are deliberately omitted rather than listed misleadingly.

    'wasm-unsafe-eval' is required: without it the browser refuses to compile
    sqlite3.wasm and the entire summit database fails to load.
    'unsafe-inline' covers the Google Tag Manager bootstrap snippet above.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;

    frame-src https://www.googletagmanager.com;
    base-uri 'self';
    form-action 'self';
    object-src 'none'
  ">
